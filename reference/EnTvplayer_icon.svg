<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="rgba(237,66,31,0.15)"/>
      <stop offset="100%" stop-color="rgba(237,66,31,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle glow accent top-right -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#glowGrad)"/>

  <!-- Minimal border -->
  <rect x="3" y="3" width="506" height="506" rx="93" ry="93" fill="none" stroke="rgba(237,66,31,0.08)" stroke-width="3"/>

  <!-- TV monitor outline -->
  <rect x="104" y="120" width="304" height="212" rx="28" ry="28" fill="none" stroke="#ED421F" stroke-width="14" stroke-linejoin="round"/>

  <!-- TV screen gradient fill -->
  <rect x="125" y="141" width="262" height="170" rx="16" ry="16" fill="rgba(237,66,31,0.06)"/>

  <!-- TV stand -->
  <path d="M208 332 L256 396 L304 332" fill="none" stroke="#ED421F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- TV base -->
  <rect x="216" y="390" width="80" height="8" rx="4" ry="4" fill="#ED421F"/>

  <!-- Play button triangle inside screen -->
  <polygon points="238,188 310,226 238,264" fill="#ED421F" opacity="0.9"/>

  <!-- Signal bars top-left -->
  <rect x="136" y="140" width="6" height="24" rx="2" fill="#ED421F" opacity="0.4"/>
  <rect x="148" y="140" width="6" height="18" rx="2" fill="#ED421F" opacity="0.6"/>
  <rect x="160" y="140" width="6" height="12" rx="2" fill="#ED421F" opacity="0.3"/>

  <!-- Live dot top-right of screen -->
  <circle cx="355" cy="152" r="6" fill="#ED421F">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
